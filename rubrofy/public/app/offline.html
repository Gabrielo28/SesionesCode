<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0e11">
  <title>Sin conexión · Rubrofy</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0e11; color: #f6f3f7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { border-radius: 14px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #b3adb8; margin: 0 0 20px; font-size: 15px; }
    button { background: #ff4d94; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/app/icon-192.png" width="72" height="72" alt="Rubrofy">
    <h1>Estás sin conexión</h1>
    <p>Rubrofy necesita internet para mostrarte tu contenido. Revisa tu conexión y vuelve a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crea tu cuenta — Rubrofy</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta property="og:title" content="Crea tu cuenta en Rubrofy">
  <meta property="og:image" content="https://rubrofy.com/img/og.jpg">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .registro-wrap { max-width: 480px; margin: 0 auto; padding: 56px 24px 80px; }
    .registro-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;
    }
    .registro-card h1 { font-size: 22px; margin: 0 0 2px; }
    .registro-card .sub { margin: 0 0 6px; font-size: 13.5px; color: var(--ink-dim); }
    .registro-card label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-dim); }
    .registro-card input, .registro-card textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--ink);
      font-family: inherit; font-size: 14px; padding: 10px 12px; resize: vertical;
    }
    .registro-card input:focus, .registro-card textarea:focus { outline: 1px solid var(--amber); }
    .form-row { display: flex; gap: 12px; }
    .form-row label { flex: 1; min-width: 0; }
    .registro-error { color: var(--coral); font-size: 12.5px; margin: 0; }
    .registro-nota { font-size: 12px; color: var(--ink-faint); margin: 0; }
    .registro-nota a { color: var(--amber); }
    .prueba-caja { border: 1.5px solid var(--rosa, #ff4d94); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--rosa-palido, #fff4f8); }
    .prueba-caja .prueba-si { flex-direction: row; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink); }
    .prueba-caja .prueba-si input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--rosa, #ff4d94); }
    .prueba-caja .prueba-si > span { display: block; flex: 1; }
    .prueba-caja .prueba-si b { display: block; font-size: 15px; margin-bottom: 2px; }
    .prueba-caja .prueba-si small { display: block; color: var(--ink-dim); font-size: 12.5px; line-height: 1.45; }
    .pg-campos { display: flex; flex-direction: column; gap: 14px; }
    .pg-campos[hidden] { display: none; }
    .pg-fila { display: flex; gap: 12px; }
    .pg-fila > label { flex: 1; min-width: 0; }
    .pg-campo { display: flex; flex-direction: column; gap: 5px; }
    .pg-acepta { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-dim); }
    .pg-acepta input { margin-top: 3px; }
    .pg-nota { margin: 0; font-size: 12px; color: var(--ink-faint); }
    .pg-error { color: var(--coral); font-size: 12px; flex-basis: 100%; }
    @media (max-width: 480px) { .pg-fila { flex-direction: column; } }
    .ref-aviso { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: rgba(63, 191, 95, 0.12); border: 1px solid rgba(63, 191, 95, 0.35); font-size: 13.5px; line-height: 1.45; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap topinner">
      <a class="brand" href="/">
        <img src="/icon-512.png?v=2" alt="Rubrofy">
        Rubrofy
      </a>
      <a class="btn btn-ghost" href="/app">Iniciar sesión</a>
    </div>
  </header>

  <div class="registro-wrap">
    <div class="registro-card">
      <div>
        <h1>Crea tu cuenta</h1>
        <p class="sub">Un negocio, una cuenta. Después te preguntamos por tu negocio y armamos tu estrategia.</p>
      </div>
      <form id="form-registro">
        <label>Nombre del negocio
          <input type="text" id="reg-nombre" required placeholder="Ej: Cabañas Los Alerces">
        </label>
        <label><span>Rubro <button type="button" class="ay" data-ayuda="reg-rubro" aria-label="Ayuda: Rubro" aria-expanded="false">?</button></span>
          <textarea id="reg-rubro" required rows="2" maxlength="300" placeholder="Ej: panadería artesanal de barrio, hacemos pan y pasteles"></textarea>
        </label>
        <label>Correo
          <input type="email" id="reg-email" required autocomplete="username">
        </label>
        <label>Clave (mínimo 8 caracteres)
          <input type="password" id="reg-password" required minlength="8" autocomplete="new-password">
        </label>
        <div class="prueba-caja" id="prueba-caja">
          <label class="prueba-si"><input type="checkbox" id="prueba-si">
            <span><b id="prueba-titulo">Quiero mis 7 días gratis del plan Pro</b><small>Sin tarjeta. Déjanos tu nombre y teléfono (el correo es el de arriba) y empiezas hoy con todo: estrategia y publicaciones con gancho, texto y hashtags.</small></span></label>
          <div id="prueba-campos"><p class="registro-nota">Cargando…</p></div>
        </div>
        <label class="acepto"><input type="checkbox" id="reg-acepto" required> <span>Acepto los <a href="/terminos.html" target="_blank" rel="noopener">términos del servicio</a> y la <a href="/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span></label>
        <p class="registro-error" id="registro-error" hidden></p>
        <button type="submit" class="btn btn-primary" id="btn-registro" style="margin-top:6px;">Crear negocio</button>
        <p class="registro-nota">¿Ya tienes cuenta? <a href="/app">Inicia sesión</a>.</p>
      </form>
    </div>
  </div>

  <script src="/app/prueba-form.js?v=41"></script>
  <script>
    (function () {
      var $ = function (sel) { return document.querySelector(sel); };
      var pideP = function () { return $('#prueba-si').checked && !!window.RubrofyPrueba; };

      // Formulario de la prueba gratis: las preguntas vienen del servidor.
      window.RubrofyPrueba.cargar().then(function (cat) {
        $('#prueba-titulo').textContent = 'Quiero mis ' + cat.dias + ' días gratis del plan ' + (cat.plan === 'estudio' ? 'Estudio' : 'Pro');
        $('#prueba-campos').innerHTML = window.RubrofyPrueba.campos(cat, {}, { sinCorreo: true });
        $('#prueba-campos').querySelectorAll('[required]').forEach(function (el) { el.dataset.req = '1'; });
        actualizarPrueba();
      }).catch(function () { $('#prueba-caja').hidden = true; });
      function actualizarPrueba() {
        var si = $('#prueba-si').checked;
        var cont = $('#prueba-campos').firstElementChild;
        if (cont) cont.hidden = !si;
        // Sin la prueba, las preguntas no son obligatorias.
        $('#prueba-campos').querySelectorAll('[data-req]').forEach(function (el) { el.required = si; });
        $('#btn-registro').textContent = si ? 'Crear cuenta y activar mi prueba' : 'Crear cuenta';
      }
      $('#prueba-si').addEventListener('change', actualizarPrueba);
      if (new URLSearchParams(location.search).get('prueba') === '0') { $('#prueba-si').checked = false; }

      // Invitación de otro negocio (?ref=CODIGO): se recuerda aunque recargue.
      var refCodigo = (new URLSearchParams(location.search).get('ref') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      try {
        if (refCodigo) localStorage.setItem('rubrofy-ref', refCodigo);
        else refCodigo = localStorage.getItem('rubrofy-ref') || '';
      } catch (err) { /* sin almacenamiento: solo vale el enlace */ }
      if (refCodigo) {
        var aviso = document.createElement('p');
        aviso.className = 'ref-aviso';
        aviso.textContent = '🎁 Llegaste con una invitación: cuando elijas tu plan, tú y quien te invitó reciben créditos para crear fotos y videos con IA.';
        $('#form-registro').prepend(aviso);
      }

      $('#form-registro').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = $('#btn-registro');
        var errorEl = $('#registro-error');
        errorEl.hidden = true;
        if (window.RubrofyPrueba) window.RubrofyPrueba.limpiarErrores($('#prueba-campos'));
        btn.disabled = true;
        var textoOriginal = btn.textContent;
        btn.textContent = 'Creando tu cuenta...';
        fetch('/api/auth/registro', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-rubrofy-panel': '1' },
          body: JSON.stringify({
            nombre: $('#reg-nombre').value,
            rubro: $('#reg-rubro').value,
            email: $('#reg-email').value,
            password: $('#reg-password').value,
            acepto: $('#reg-acepto').checked,
            prueba: pideP() ? window.RubrofyPrueba.leer($('#prueba-campos')) : undefined,
            ref: refCodigo || undefined,
          }),
        }).then(function (res) {
          if (!res.ok) return res.json().then(function (d) {
            var e = new Error(d.error || 'No se pudo crear la cuenta');
            if (d.campo && d.campo.indexOf('prueba.') === 0) e.enFormulario = window.RubrofyPrueba.marcarError($('#prueba-campos'), d.campo.slice(7), d.error);
            throw e;
          });
          window.location.href = '/app';
        }).catch(function (err) {
          errorEl.textContent = err.message;
          errorEl.hidden = !!err.enFormulario;
          btn.disabled = false;
          btn.textContent = textoOriginal;
        });
      });
    })();
  </script>
  <script src="/app/ayuda.js?v=41"></script>
</body>
</html>

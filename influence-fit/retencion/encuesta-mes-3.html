<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta de 3 meses</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#12959C;--ink:#123638;--soft:#2c4a4c;--muted:#6B8B8C;--line:#D7EBEB;--wash:#E6F1F1;--coral:#FF7B7B}
  *{box-sizing:border-box} body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:#F3F8F8;line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:26px;margin:0 0 6px;line-height:1.15} .sub{color:var(--soft);margin:0 0 20px;font-size:15px}
  form{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:20px}
  .q label{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .scale label{display:grid;place-items:center;height:38px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;margin:0}
  .scale input{display:none} .scale label:has(input:checked){background:var(--teal);color:#fff;border-color:var(--teal)}
  .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
  textarea,input[type=text]{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px}
  textarea{min-height:70px;resize:vertical}
  .opts{display:grid;gap:8px} .opts label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;margin:0}
  .opts label:has(input:checked){background:var(--wash);border-color:var(--teal)}
  button{font:inherit;font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;border:0;background:var(--coral);color:#fff;cursor:pointer}
  .done{display:none;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:28px;text-align:center}
  .done.show{display:block} .done h2{margin:0 0 8px}
</style></head>
<body><div class="wrap">
  <h1>3 meses entrenando juntos</h1>
  <p class="sub" id="sub">5 preguntas, 2 minutos. Esto es lo que uso para mejorar tu programa.</p>
  <form id="f">
    <div class="q"><label for="nombre">Tu nombre</label><input type="text" id="nombre" name="nombre" required></div>
    <div class="q"><label>¿Qué tan cerca sientes que estás de tu objetivo?</label>
      <div class="scale" id="s1"></div><div class="ends"><span>Nada cerca</span><span>Ya llegué</span></div></div>
    <div class="q"><label>¿Qué tan probable es que recomiendes a <span class="coach">tu coach</span> a un amigo?</label>
      <div class="scale" id="s2"></div><div class="ends"><span>Nada probable</span><span>Seguro</span></div></div>
    <div class="q"><label for="mas_sirvio">¿Qué fue lo que más te sirvió?</label><textarea id="mas_sirvio" name="mas_sirvio"></textarea></div>
    <div class="q"><label for="cambiaria">¿Qué cambiarías?</label><textarea id="cambiaria" name="cambiaria"></textarea></div>
    <div class="q"><label>¿Seguimos?</label>
      <div class="opts">
        <label><input type="radio" name="seguir" value="Sí" required> Sí, sigo igual</label>
        <label><input type="radio" name="seguir" value="Sí con cambios"> Sí, pero con cambios (horario, frecuencia, modalidad)</label>
        <label><input type="radio" name="seguir" value="No sé"> Todavía no sé</label>
        <label><input type="radio" name="seguir" value="No"> No por ahora</label>
      </div></div>
    <div class="q"><label for="comentario">Algo más que quieras decirme (opcional)</label><textarea id="comentario" name="comentario"></textarea></div>
    <button type="submit" id="btn">Enviar</button>
  </form>
  <div class="done" id="done"><h2>Gracias</h2><p id="doneMsg">Ya lo tengo. Te escribo por WhatsApp.</p></div>
</div>
<script>
  // URL /exec del Apps Script retencion.gs (función doPost). Si queda vacío, abre WhatsApp con las respuestas.
  const CONFIG = { WEBHOOK_URL: '', COACHES: { gabriel: { nombre: 'Gabriel', whatsapp: '56965450723' }, demo: { nombre: 'tu coach', whatsapp: '' } } };
  const q = new URLSearchParams(location.search);
  const slug = (q.get('coach') || 'demo').toLowerCase();
  const coach = CONFIG.COACHES[slug] || { nombre: slug, whatsapp: '' };
  document.querySelectorAll('.coach').forEach(e => e.textContent = coach.nombre);
  if (q.get('nombre')) document.getElementById('nombre').value = q.get('nombre');
  ['s1', 's2'].forEach((id, k) => {
    const name = k === 0 ? 'cerca_meta' : 'nps';
    document.getElementById(id).innerHTML = Array.from({ length: 11 }, (_, n) => `<label><input type="radio" name="${name}" value="${n}" required>${n}</label>`).join('');
  });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target; if (!f.checkValidity()) { f.reportValidity(); return; }
    const d = Object.fromEntries(new FormData(f).entries());
    d.cerca_meta = Number(d.cerca_meta); d.nps = Number(d.nps); d.coach = slug; d.fecha = new Date().toISOString();
    let ok = false;
    if (CONFIG.WEBHOOK_URL) { try { const r = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) }); ok = r.ok; } catch (err) {} }
    f.style.display = 'none'; document.getElementById('done').classList.add('show');
    if (!ok && coach.whatsapp) {
      const t = `Hola ${coach.nombre}, mi encuesta de 3 meses:\nCerca del objetivo: ${d.cerca_meta}/10\nRecomendaría: ${d.nps}/10\nMás me sirvió: ${d.mas_sirvio || '-'}\nCambiaría: ${d.cambiaria || '-'}\nSeguir: ${d.seguir}\n${d.comentario || ''}`;
      document.getElementById('doneMsg').innerHTML = `Un paso más: <a href="https://wa.me/${coach.whatsapp}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">envíaselo por WhatsApp</a>, ya viene escrito.`;
    }
  });
</script></body></html>
